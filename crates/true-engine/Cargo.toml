[package]
name = "true-engine"
version.workspace = true
edition.workspace = true

[dependencies]
glam = { version = "0.27", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
wgpu = { version = "0.19", features = ["webgl"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
pollster = "0.3"
