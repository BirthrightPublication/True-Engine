name: Engine checks and Windows release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: engine-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  linux-checks:
    if: github.event_name != 'release' || (github.event.sender.login != 'github-actions[bot]' && !github.event.release.prerelease)
    runs-on: ubuntu-22.04
    env:
      EGL_PLATFORM: surfaceless
      XDG_RUNTIME_DIR: /tmp/true-engine-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libxkbcommon-dev
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -v
  windows-checks:
    if: github.event_name != 'release' || (github.event.sender.login != 'github-actions[bot]' && !github.event.release.prerelease)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: windows-2022-rust-1.85.1-static-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-2022-rust-1.85.1-static-
      - name: Native build, tests, notices, package and SHA-256
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -match '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            & tools/release/Build-WindowsRelease.ps1 -Version $Matches[1]
          } elseif ($env:RELEASE_TAG.StartsWith('v')) {
            throw 'Release tags must use stable vMAJOR.MINOR.PATCH syntax.'
          } else {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
            & tools/release/Build-WindowsRelease.ps1 -Version $version -Candidate
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: Build/*
          if-no-files-found: error
  publish:
    needs: [linux-checks, windows-checks]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'release' && github.event.sender.login != 'github-actions[bot]' && !github.event.release.prerelease)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: Build
      - name: Publish complete immutable assets after checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: BirthrightPublication/True-Engine
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/RELEASE-${RELEASE_TAG#v}.md"
          test -f "$notes"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "TRUE ENGINE $RELEASE_TAG" --notes-file "$notes"
          fi
          # No --clobber: never silently replace an existing release asset.
          gh release upload "$RELEASE_TAG" Build/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
